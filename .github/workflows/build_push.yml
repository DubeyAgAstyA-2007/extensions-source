name: Build and Publish Selected Extensions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Curated Extensions
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Local Signing Key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Enabled Extensions
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          KEY_STORE_PASSWORD: android
          KEY_PASSWORD: android
          ALIAS: androiddebugkey
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Generate Repository Index & Publish
        run: |
          chmod +x gradlew
          # Runs Keiyoushi's built-in inspector tool to create index.min.json and repo structure
          ./gradlew runInspector --no-daemon || true

          mkdir -p repo-output
          find . -name "*.apk" -exec cp {} repo-output/ \;
          find . -name "index.min.json" -exec cp {} repo-output/ \; || true
          find . -name "index.pb" -exec cp {} repo-output/ \; || true

      - name: Deploy to repo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: ./repo-output
          force_orphan: true
