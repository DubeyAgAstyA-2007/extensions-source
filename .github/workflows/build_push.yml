name: Build and Publish Selected Extensions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Curated Extensions
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Local Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          # Copy to common filenames expected by Gradle build-logic
          cp debug.keystore signing-key.jks
          cp debug.keystore keystore.jks

      - name: Build Enabled Extensions
        env:
          KEY_STORE_PASSWORD: android
          KEY_PASSWORD: android
          ALIAS: androiddebugkey
          SIGNING_KEY_PASSWORD: android
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Repository Output
        run: |
          mkdir -p repo-output
          find . -name "*.apk" -exec cp {} repo-output/ \;
          find . -name "*.json" -path "*/build/*" -exec cp {} repo-output/ \; || true
          find . -name "*.pb" -path "*/build/*" -exec cp {} repo-output/ \; || true

      - name: Deploy to repo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: ./repo-output
          force_orphan: true
